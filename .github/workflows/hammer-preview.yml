name: Hammer motion preview
on:
  push:
    paths:
      - src/hammer-motion.js
      - src/hammer-grip.js
      - src/render.js
      - src/melee-motion.js
      - src/melee-pose.js
      - scripts/melee-preview.cjs
      - scripts/melee-ready-preview.cjs
      - tests/hammer-motion.test.mjs
      - .github/workflows/hammer-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm test
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
      - run: node scripts/melee-ready-preview.cjs --weapon=hammer --before=7b99fc6be180ec15dbc883a62613f31989bf23d1
        env:
          MELEE_READY_OUTPUT: /tmp/hammer-preview/ready
      - run: node scripts/melee-motion-browser.cjs --weapons=hammer --matrix-only
        env:
          MELEE_REVIEW_OUTPUT: /tmp/hammer-preview/matrix
      - run: node scripts/melee-preview.cjs --weapon=hammer
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          MELEE_PREVIEW_OUTPUT: /tmp/hammer-preview/combo
      - run: node scripts/melee-preview.cjs --weapon=hammer --charge
        if: github.ref_name == 'main' || github.event_name == 'workflow_dispatch'
        env:
          MELEE_PREVIEW_OUTPUT: /tmp/hammer-preview/charge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hammer-motion-preview
          path: |
            /tmp/hammer-preview/ready
            /tmp/hammer-preview/combo/deliverables
            /tmp/hammer-preview/charge/deliverables
            /tmp/hammer-preview/matrix/review.json
