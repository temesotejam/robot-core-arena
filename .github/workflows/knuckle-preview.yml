name: Knuckle motion preview
on:
  push:
    paths:
      - scripts/knuckle-preview.cjs
      - .github/workflows/knuckle-preview.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.63.0
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: node scripts/knuckle-preview.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knuckle-motion-preview
          path: /tmp/knuckle-preview/deliverables
